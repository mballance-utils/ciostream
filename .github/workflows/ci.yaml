
on:
  push:
  pull_request:
    types: [opened, synchronize, edited, reopened]
  workflow_dispatch:


jobs:
    gate:
      # Release master switch. ONE file, above both platforms, decides who
      # releases this repo:
      #   https://dvkit.org/.well-known/release-authority.json
      # Generated from sync-policy.toml by `git-sync emit-release-authority`, so
      # GitHub and Forgejo cannot drift -- there is only one copy for them to
      # disagree about. The runner only READS it, over plain HTTPS with no
      # credential: a workflow file is public and editable by anyone who can push.
      #
      # `if:` on a job cannot reference a step in its own job, so the switch is
      # resolved here and consumed through needs.gate.outputs.authority.
      name: Release authority
      runs-on: ubuntu-latest
      outputs:
        authority: ${{ steps.resolve.outputs.authority }}
      steps:
        - id: resolve
          # One line on purpose: a multi-line `python3 -c` has to start at column
          # 0, which terminates the YAML block scalar and silently corrupts the
          # workflow.
          run: |
            url=https://dvkit.org/.well-known/release-authority.json
            if ! body=$(curl -fsS --max-time 10 "$url"); then
              # DECIDED 2026-08-30: fail CLOSED on a tag. A release blocked by a
              # dvkit.org outage is recoverable; a release published twice from
              # two forges is not. Quiet on a non-tag ref -- nothing was due.
              case "$GITHUB_REF" in
                refs/tags/v*)
                  echo "::error::release-authority switch unreachable; refusing to publish"
                  exit 1 ;;
                *)
                  echo "authority=none" >> "$GITHUB_OUTPUT"
                  echo "switch unreachable on a non-tag ref; nothing to release"
                  exit 0 ;;
              esac
            fi
            auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
            echo "release authority for $GITHUB_REPOSITORY: $auth"
            echo "authority=$auth" >> "$GITHUB_OUTPUT"

    sdist:
      needs: [gate]
      name: sdist
      runs-on: ubuntu-latest
      steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build sdist
        run: |
          python -V
          python -m pip install twine Cython setuptools
          python setup.py sdist
      - name: Publish to PyPi
        if: startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

    linux:
      needs: [gate]
      name: ciostream ${{ matrix.arch }} manylinux2014 ${{ matrix.spec }}
      runs-on: ubuntu-latest
      strategy:
        matrix:
          include:
          # x86_64
          - { arch: x86_64, spec: cp38 }
          - { arch: x86_64, spec: cp39 }
          - { arch: x86_64, spec: cp310 }
          - { arch: x86_64, spec: cp311 }
          - { arch: x86_64, spec: cp312 }
          - { arch: x86_64, spec: cp313 }
          # aarch64
          - { arch: aarch64, spec: cp38 }
          - { arch: aarch64, spec: cp39 }
          - { arch: aarch64, spec: cp310 }
          - { arch: aarch64, spec: cp311 }
          - { arch: aarch64, spec: cp312 }
          - { arch: aarch64, spec: cp313 }

      steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build/Test Package
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: ${{ matrix.spec }}-manylinux_${{ matrix.arch }}
          CIBW_BEFORE_BUILD: pip install Cython
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT_PASS_LINUX: GITHUB_RUN_ID
        run: |
          set -eux
          python3 -V
          python3 -m pip install -U --user cibuildwheel
          python3 -m cibuildwheel --platform linux --output-dir dist .
          ls dist
      - name: Publish to PyPi
        if: startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

    macos:
      needs: [gate]
      name: ciostream ${{ matrix.arch }} ${{ matrix.spec }}
      runs-on: ${{ matrix.runner }}
      strategy:
        fail-fast: false
        matrix:
          include:
          # x86_64 (Intel) — cross-compiled on arm64 runner via cibuildwheel
          - { runner: macos-latest, arch: x86_64, spec: cp38 }
          - { runner: macos-latest, arch: x86_64, spec: cp39 }
          - { runner: macos-latest, arch: x86_64, spec: cp310 }
          - { runner: macos-latest, arch: x86_64, spec: cp311 }
          - { runner: macos-latest, arch: x86_64, spec: cp312 }
          - { runner: macos-latest, arch: x86_64, spec: cp313 }
          # arm64 (Apple Silicon) — macos-latest is arm64
          - { runner: macos-latest, arch: arm64,  spec: cp38 }
          - { runner: macos-latest, arch: arm64,  spec: cp39 }
          - { runner: macos-latest, arch: arm64,  spec: cp310 }
          - { runner: macos-latest, arch: arm64,  spec: cp311 }
          - { runner: macos-latest, arch: arm64,  spec: cp312 }
          - { runner: macos-latest, arch: arm64,  spec: cp313 }

      steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Build/Test Package
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: ${{ matrix.spec }}-macosx_${{ matrix.arch }}
          CIBW_BEFORE_BUILD: pip install Cython
          CIBW_BUILD_VERBOSITY: 1
        run: |
          python3 -V
          pipx run cibuildwheel --platform macos --output-dir dist .
          ls dist
      - name: Publish to PyPi
        if: startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pipx run twine upload dist/*.whl

    windows:
      needs: [gate]
      name: ciostream ${{ matrix.platform }} ${{ matrix.python_arch }} ${{ matrix.spec }}
      runs-on: ${{ matrix.platform }}
      strategy:
        matrix:
          include:
          - platform: windows-latest
            build_arch: x64
            python_arch: x64
            spec: '3.8'
          - platform: windows-latest
            build_arch: x64
            python_arch: x64
            spec: '3.9'
          - platform: windows-latest
            build_arch: x64
            python_arch: x64
            spec: '3.10'
          - platform: windows-latest
            build_arch: x64
            python_arch: x64
            spec: '3.11'
          - platform: windows-latest
            build_arch: x64
            python_arch: x64
            spec: '3.12'
          - platform: windows-latest
            build_arch: x64
            python_arch: x64
            spec: '3.13'
      steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install python ${{ matrix.spec }}
        uses: actions/setup-python@v5
        with:
          architecture: ${{ matrix.python_arch }}
          python-version: ${{ matrix.spec }}

      - name: Build/Test Package
        shell: bash
        run: |
          python -V
          python -m pip install Cython wheel twine setuptools
          python setup.py build bdist_wheel
          ls dist

      - name: Publish to PyPi
        if: startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
            python -m twine upload dist/*.whl

